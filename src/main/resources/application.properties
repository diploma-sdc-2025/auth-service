spring.application.name=auth-service-back

server.port=${SERVER_PORT:8080}

# Issuer HS256 key — MUST match game-service and other JWT consumers (same env or default below).
auth.jwt.secret=${AUTH_JWT_SECRET:local-dev-hmac-sha256-secret-at-least-32-bytes-long!!}

spring.datasource.hikari.maximum-pool-size=3
spring.datasource.hikari.minimum-idle=0
spring.datasource.hikari.idle-timeout=20000
spring.datasource.hikari.max-lifetime=300000
spring.datasource.hikari.connection-timeout=30000

spring.datasource.url=jdbc:postgresql://${DB_SERVER}.postgres.database.azure.com:${DB_PORT}/${DB_NAME}?sslmode=require
spring.datasource.username=${DB_USERNAME}
spring.datasource.password=${DB_PASSWORD}
spring.datasource.driver-class-name=org.postgresql.Driver

spring.jpa.hibernate.ddl-auto=none
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect

# Flyway config
spring.flyway.enabled=true
spring.flyway.schemas=public
spring.flyway.locations=classpath:db/migration
spring.flyway.clean-disabled=false
spring.flyway.placeholders.APP_USER=${APP_USER}
spring.flyway.placeholders.APP_PASSWORD=${APP_PASSWORD}

logging.level.org.flywaydb=DEBUG
logging.level.org.springframework.jdbc=DEBUG

# Shared with game-service for POST /api/internal/match-rating (service-to-service rating updates).
diploma.internal-api.secret=${INTERNAL_API_SECRET:local-dev-internal-secret}